# Must differ from upstream Marketplace id (com.hiberbee.intellij.hiberbee-theme)
# or the IDE treats this as the same plugin and replaces it.
pluginGroup = dev.bitnix.hiberbee
pluginName = Hiberbee (bitnix)
pluginVersion = 1.1.0

# Compatible with 2023.1+; open upper bound for continuous IDE updates.
pluginSinceBuild = 231
pluginUntilBuild =

# Target platform for compile / runIde (theme-only → any IC/IU base works).
platformType = IC
platformVersion = 2024.2

javaVersion = 21

# GitHub owner/repo for custom plugin repository download URLs.
githubRepo = bitnixdev/hiberbee

org.gradle.jvmargs = -Xmx2g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.parallel = true
